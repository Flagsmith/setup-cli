name: Setup Flagsmith CLI
description: >-
  Install the Flagsmith CLI and, when the job has an OIDC identity, exchange it
  for a short-lived Flagsmith access token.
author: Flagsmith

branding:
  icon: flag
  color: purple

inputs:
  api-url:
    description: Flagsmith API base URL.
    required: false
    default: https://api.flagsmith.com
  audience:
    description: >-
      The `aud` claim to request for the GitHub OIDC token. Leave unset to use
      GitHub's default audience (https://github.com/OWNER), which is what the
      GitHub Actions trust relationship form expects. Set it to target a trust
      relationship configured with a specific audience.
    required: false
    default: ''
  cli-version:
    description: >-
      Version of the CLI to install, e.g. `v2.0.0`. Defaults to the latest
      release.
    required: false
    default: latest

# This action has no outputs. It puts `flagsmith` on PATH and the credential in
# the environment, and everything a workflow might have read from an output is
# already available from the CLI itself: `flagsmith --version` for the version,
# `flagsmith auth status` for whether authentication worked, and `flagsmith auth
# token` if a script needs the raw credential. Exposing the access token as an
# output would only invite copying a credential between steps and jobs.

runs:
  using: node24
  main: dist/index.cjs
