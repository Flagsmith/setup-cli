name: Setup Flagsmith CLI
description: >-
  Install the Flagsmith CLI and, when the job has an OIDC identity, exchange it
  for a short-lived Flagsmith access token.
author: Flagsmith

branding:
  icon: flag
  color: purple

inputs:
  api-url:
    description: Flagsmith API base URL.
    required: false
    default: https://api.flagsmith.com
  audience:
    description: >-
      The `aud` claim to request for the GitHub OIDC token. Leave unset to use
      GitHub's default audience (https://github.com/OWNER), which is what the
      GitHub Actions trust relationship form expects. Set it to target a trust
      relationship configured with a specific audience.
    required: false
    default: ''
  cli-version:
    description: >-
      Version of the CLI to install, e.g. `v2.0.0`. Defaults to the latest
      release.
    required: false
    default: latest

outputs:
  cli-version:
    description: The CLI version that was installed.
  api-url:
    description: The Flagsmith API base URL the CLI is configured against.
  access-token:
    description: >-
      The exchanged access token. Empty when the job has no OIDC identity. Also
      exported to the environment for the CLI to pick up, so most workflows do
      not need this.
  expires-in:
    description: Lifetime of the access token in seconds. Empty when no token was minted.

runs:
  using: node24
  main: dist/index.cjs
