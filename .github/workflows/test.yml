name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api-url:
        description: Flagsmith API base URL to test against.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test, and check dist is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The runner executes dist/, not src/, so a stale bundle would ship code
      # nobody reviewed.
      - name: Check in dist/ is up to date
        run: |
          npm run build
          if ! git diff --quiet -- dist; then
            echo '::error title=dist is stale::Run `npm run build` and commit dist/.'
            git diff --stat -- dist
            exit 1
          fi

  auth:
    name: Install and authenticate via OIDC
    needs: build
    # Set the STAGING_API_URL repository variable to test the token exchange.
    if: vars.STAGING_API_URL != '' || inputs.api-url != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          api-url: ${{ inputs.api-url || vars.STAGING_API_URL }}
      # The acceptance criterion from Flagsmith/actions#9.
      - name: Prove the CLI is installed, and we are logged in
        run: flagsmith auth status

  install:
    name: Install on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # No id-token permission: the CLI installs, and auth is skipped.
    steps:
      - uses: actions/checkout@v4
      - uses: ./
      - run: flagsmith --version
        shell: bash

  install-in-container:
    name: Install inside a container
    needs: build
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v4
      - uses: ./
      - run: flagsmith --version
        shell: sh

  cache-and-pin:
    name: Reuse the tool cache, and honour a pinned version
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          cli-version: v2.0.0-beta.3
      # The second install must hit the tool cache rather than reinstalling.
      - uses: ./
        with:
          cli-version: v2.0.0-beta.3
      - run: flagsmith --version | grep -F v2.0.0-beta.3

  existing-credential:
    name: Skip the exchange when the job brings a credential
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Not a real key: the action must not attempt an exchange, and must not
      # validate it either — the CLI does that when it is used.
      FLAGSMITH_API_KEY: ser.notarealkey
    steps:
      - uses: actions/checkout@v4
      - uses: ./
      - name: The action must not have exchanged a token
        run: |
          set -euo pipefail
          flagsmith --version
          # A credential was already present, so nothing should have been minted.
          if env | grep -q '^FLAGSMITH_ACCESS_TOKEN'; then
            echo 'the action exported an access token it should not have'
            exit 1
          fi
